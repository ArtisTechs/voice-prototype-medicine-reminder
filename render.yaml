# Render Blueprint: New + > Blueprint > pick this repo. See docs/deploy-render.md.
# Render has no managed MySQL, so DATABASE_URL points at an outside MySQL 8 (Aiven, TiDB Cloud, ...).
# One web service runs the API *and* the cron jobs (EMBED_WORKER) so a single paid instance is enough.
services:
  - type: web
    name: voice-api
    runtime: docker
    plan: starter            # free spins down after 15 min idle: the pillbox and the missed-dose jobs need an always-on service
    region: singapore        # closest to the Philippines
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /healthz
    autoDeploy: true
    # Scan photos: without a disk they vanish on every deploy (the scan result is still saved). Uncomment to keep them.
    # disk:
    #   name: scans
    #   mountPath: /data/scans
    #   sizeGB: 1
    envVars:
      # ---- Fill these in the Render dashboard (Environment tab); they are never stored in git ----
      - key: DATABASE_URL        # mysql://user:password@host:3306/medrem  (URL-encode special characters)
        sync: false
      - key: DATABASE_CA_CERT    # the MySQL provider's CA certificate (Aiven: Overview > CA certificate)
        sync: false
      - key: GEMINI_API_KEY      # https://aistudio.google.com/apikey
        sync: false
      - key: EXPO_ACCESS_TOKEN   # optional
        sync: false
      # ---- Generated by Render on first deploy: copy DEVICE_PATH_SECRET into the firmware's BACKEND_URL ----
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_PATH_SECRET
        generateValue: true
      # ---- Wired automatically ----
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voice-redis
          property: connectionString
      # ---- Settings ----
      - key: ENV
        value: prod
      - key: EMBED_WORKER
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: ENABLE_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DEVICE_TZ
        value: Asia/Manila
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MAX_PER_MINUTE
        value: "10"
      - key: CORS_ORIGINS
        value: ""

  # Optional: run the jobs in their own service instead of EMBED_WORKER=true (then set it to false above).
  # - type: worker
  #   name: voice-worker
  #   runtime: docker
  #   plan: starter
  #   region: singapore
  #   dockerfilePath: ./services/api/Dockerfile
  #   dockerContext: ./services/api
  #   dockerCommand: node dist/src/worker.js
  #   envVars: (same DATABASE_URL, REDIS_URL, JWT_SECRET, ... plus RUN_MIGRATIONS=false)

  - type: keyvalue
    name: voice-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # only Render services in the same region can connect
