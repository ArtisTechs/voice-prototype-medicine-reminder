# Base services (prod-safe). Dev: + docker-compose.dev.yml. Prod: + docker-compose.prod.yml.
name: medrem

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medrem}:${POSTGRES_PASSWORD:-medrem}@db:5432/${POSTGRES_DB:-medrem}
  REDIS_URL: redis://redis:6379/0
  SCAN_DIR: /data/scans

x-api-build: &api-build
  context: ./services/api
  target: runtime

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medrem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medrem}
      POSTGRES_DB: ${POSTGRES_DB:-medrem}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: *api-build
    image: medrem/api:latest
    env_file: .env
    environment: *api-env
    ports:
      # The ESP32 firmware calls http://<PC LAN IP>:5000, so publish on all interfaces and keep 5000.
      # API_PORT only exists to dodge a local port clash while developing without the real pillbox.
      - "0.0.0.0:${API_PORT:-5000}:5000"
    volumes:
      - scans:/data/scans
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    build: *api-build
    image: medrem/api:latest
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
      SEED_DEMO: "false"
      VISION_ENABLED: "false"
    volumes:
      - scans:/data/scans
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  scans:
