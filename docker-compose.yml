# Base services (prod-safe). Dev: + docker-compose.dev.yml. Prod: + docker-compose.prod.yml.
name: medrem

x-api-env: &api-env
  # Unset = the local db container. Set DATABASE_URL in .env to use another MySQL 8 (special characters in the
  # password must be URL-encoded).
  DATABASE_URL: ${DATABASE_URL:-mysql://${MYSQL_USER:-medrem}:${MYSQL_PASSWORD:-medrem}@db:3306/${MYSQL_DATABASE:-medrem}}
  REDIS_URL: redis://redis:6379/0
  SCAN_DIR: /data/scans
  PORT: "5055"

x-api-build: &api-build
  context: ./services/api
  target: runtime

services:
  db:
    image: mysql:8.4
    # utf8mb4 so names with accents and emoji survive.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medrem-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medrem}
      MYSQL_USER: ${MYSQL_USER:-medrem}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medrem}
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: *api-build
    image: medrem/api:latest
    env_file: .env
    environment: *api-env
    ports:
      # The ESP32 firmware calls http://<PC LAN IP>:5055, so publish on all interfaces and keep 5055.
      # API_PORT only exists to dodge a local port clash while developing without the real pillbox.
      - "0.0.0.0:${API_PORT:-5055}:5055"
    volumes:
      - scans:/data/scans
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5055/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    build: *api-build
    image: medrem/api:latest
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
      SEED_DEMO: "false"
    volumes:
      - scans:/data/scans
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata:
  scans:
